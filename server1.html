<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server 1 — Aushad Pharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy-900:#071828;--navy-800:#0c2340;--navy-700:#112d52;
  --navy-200:#aac7f0;--navy-100:#d4e5f9;--navy-50:#edf4fd;
  --blue:#2563eb;--blue-l:#3b82f6;
  --text-primary:#07182e;--text-secondary:#3a5268;--text-muted:#7896ae;
  --border:#dde8f2;--bg:#eef3f9;--card:#ffffff;
  --shadow:0 2px 8px rgba(4,17,31,.07),0 16px 48px rgba(4,17,31,.10);
}
@media(prefers-color-scheme:dark){
  :root{
    --text-primary:#e6f0fb;--text-secondary:#7ea4bf;--text-muted:#3d5f78;
    --border:#102338;--bg:#060f1c;--card:#0b1a2e;
    --shadow:0 2px 8px rgba(0,0,0,.3),0 16px 48px rgba(0,0,0,.35);
  }
}
html{font-size:16px;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px;position:relative;overflow-x:hidden;
}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(37,99,235,.13) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;top:-25%;left:-20%;width:65vw;height:65vw;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.08) 0%,transparent 65%);pointer-events:none;z-index:0;}

.wrapper{position:relative;z-index:1;width:100%;max-width:420px;animation:riseIn .55s cubic-bezier(.22,1,.36,1) both;}
@keyframes riseIn{from{opacity:0;transform:translateY(22px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

.header{background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 100%);border-radius:22px 22px 0 0;padding:20px 26px;display:flex;align-items:center;gap:13px;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;}
.logo-ring{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
.logo-ring i{font-size:18px;color:var(--navy-100);}
.header-info{flex:1;min-width:0;position:relative;z-index:1;}
.co-name{font-family:'Sora',sans-serif;font-size:13.5px;font-weight:600;color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-tag{font-size:10px;color:var(--navy-200);margin-top:3px;letter-spacing:.05em;text-transform:uppercase;}
.live-pill{position:relative;z-index:1;flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:10px;font-weight:500;color:var(--navy-100);}
.pulse{width:6px;height:6px;border-radius:50%;background:#60a5fa;animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

.card{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 24px 24px;padding:36px 28px 28px;box-shadow:var(--shadow);}

/* server icon */
.vis-wrap{display:flex;justify-content:center;margin-bottom:22px;}
.vis{width:68px;height:68px;border-radius:18px;background:var(--navy-800);box-shadow:0 8px 28px rgba(7,24,40,.32);display:flex;align-items:center;justify-content:center;position:relative;}
.vis i{font-size:30px;color:var(--navy-100);position:relative;z-index:1;}
.vis::before,.vis::after{content:'';position:absolute;inset:-10px;border-radius:26px;border:1.5px solid var(--blue-l);opacity:0;animation:ring 2.4s ease-out infinite;}
.vis::after{animation-delay:1.2s;}
@keyframes ring{0%{opacity:.5;transform:scale(1);}100%{opacity:0;transform:scale(1.36);}}

.heading{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;color:var(--text-primary);letter-spacing:-.025em;text-align:center;margin-bottom:4px;}
.sub{font-size:13px;font-weight:300;color:var(--text-secondary);text-align:center;line-height:1.6;margin-bottom:28px;}

/* progress */
.prog-box{background:var(--navy-50);border:1px solid var(--navy-100);border-radius:12px;padding:16px 18px;margin-bottom:20px;}
@media(prefers-color-scheme:dark){.prog-box{background:rgba(37,99,235,.07);border-color:rgba(96,165,250,.15);}}
.prog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.prog-lbl{font-size:10.5px;font-weight:500;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;}
@media(prefers-color-scheme:dark){.prog-lbl{color:var(--navy-200);}}
.prog-pct{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--blue);}
@media(prefers-color-scheme:dark){.prog-pct{color:var(--navy-200);}}
.prog-track{height:5px;background:var(--navy-100);border-radius:99px;overflow:hidden;}
@media(prefers-color-scheme:dark){.prog-track{background:rgba(96,165,250,.15);}}
.prog-bar{height:100%;background:var(--blue);border-radius:99px;width:0%;transition:width .25s ease;}

/* status line */
.status-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;font-size:13px;color:var(--text-muted);}
.status-line i{font-size:16px;color:var(--blue-l);}
#status-text{font-weight:400;color:var(--text-secondary);}

/* footer */
.foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.foot-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);}
.foot-item i{font-size:13px;color:var(--blue-l);}

.back{position:relative;z-index:1;margin-top:20px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);text-decoration:none;transition:color .2s;align-self:flex-start;}
.back:hover{color:var(--blue);}
.back i{font-size:14px;}

@media(max-width:480px){
  .card{padding:28px 20px 22px;}
  .heading{font-size:21px;}
  .foot{justify-content:center;gap:14px;}
  .live-pill{display:none;}
}
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="logo-ring"><i class="ti ti-pill"></i></div>
    <div class="header-info">
      <div class="co-name">Aushad Pharma Distributors Pvt Ltd</div>
      <div class="co-tag">Inventory Management Portal</div>
    </div>
    <div class="live-pill"><span class="pulse"></span>Live</div>
  </div>

  <div class="card">
    <div class="vis-wrap">
      <div class="vis"><i class="ti ti-server"></i></div>
    </div>

    <div class="heading">Server 1</div>
    <div class="sub">Primary distribution node</div>

    <div class="prog-box">
      <div class="prog-head">
        <span class="prog-lbl" id="prog-lbl">Connecting</span>
        <span class="prog-pct" id="pct">0%</span>
      </div>
      <div class="prog-track"><div class="prog-bar" id="bar"></div></div>
    </div>

    <div class="status-line">
      <i class="ti ti-loader-2" id="status-icon" style="animation:spin 1s linear infinite;"></i>
      <span id="status-text">Establishing connection…</span>
    </div>

    <div class="foot">
      <div class="foot-item"><i class="ti ti-lock"></i>Encrypted</div>
      <div class="foot-item"><i class="ti ti-refresh"></i>Live data</div>
      <div class="foot-item"><i class="ti ti-shield-check"></i>Internal only</div>
    </div>
  </div>

  <a class="back" href="index.html"><i class="ti ti-arrow-left"></i>Back to portal</a>
</div>

<style>
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>

<script>
const bar = document.getElementById('bar');
const pct = document.getElementById('pct');
const lbl = document.getElementById('prog-lbl');
const icon = document.getElementById('status-icon');
const txt = document.getElementById('status-text');

const phases = [
  { end: 40, label: 'Connecting', status: 'Establishing connection…' },
  { end: 80, label: 'Loading',    status: 'Loading inventory data…'  },
  { end: 100, label: 'Ready',     status: 'Almost there…'            },
];

let p = 0, phase = 0;

const iv = setInterval(() => {
  p = Math.min(p + (Math.random() * 3 + 2), phases[phase].end);
  bar.style.width = p + '%';
  pct.textContent = Math.round(p) + '%';
  lbl.textContent = phases[phase].label;
  txt.textContent = phases[phase].status;

  if (p >= phases[phase].end) {
    phase++;
    if (phase >= phases.length) {
      clearInterval(iv);
      icon.className = 'ti ti-check';
      icon.style.animation = 'none';
      icon.style.color = 'var(--blue)';
      txt.textContent = 'Connected — redirecting…';
      lbl.textContent = 'Done';
      setTimeout(() => { window.location.href = 'http://122.166.44.185:8181/livestocksales/'; }, 500);
    }
  }
}, 55);
</script>
</body>
</html>
