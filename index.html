<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aushad Pharma Distributors Pvt Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L5L9W8DM4K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-L5L9W8DM4K');
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-950: #022c22;
    --green-900: #064e3b;
    --green-800: #065f46;
    --green-700: #047857;
    --green-500: #10b981;
    --green-200: #a7f3d0;
    --green-100: #d1fae5;
    --green-50:  #ecfdf5;
    --blue-900:  #1e3a8a;
    --blue-200:  #bfdbfe;
    --blue-50:   #eff6ff;
    --text-primary:   #0f172a;
    --text-secondary: #475569;
    --text-muted:     #94a3b8;
    --border:         #e2e8f0;
    --surface:        #f8fafc;
    --white:          #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #64748b;
      --border:         #1e293b;
      --surface:        #0f172a;
      --white:          #1e293b;
    }
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 36px;
    max-width: 460px;
    width: 100%;
  }

  /* Logo row */
  .logo-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }

  .logo-mark {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--green-900);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-mark i {
    font-size: 28px;
    color: var(--green-100);
  }

  .company-info { display: flex; flex-direction: column; gap: 4px; }

  .company-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .company-tag {
    font-size: 11px;
    font-weight: 500;
    color: var(--green-700);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Divider */
  .rule {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 28px;
  }

  /* Hero */
  .hero { margin-bottom: 32px; }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--green-50);
    border: 1px solid var(--green-200);
    color: var(--green-800);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    border-radius: 20px;
    padding: 5px 12px;
    margin-bottom: 18px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green-500);
    animation: blink 1.8s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }

  .page-title {
    font-size: 38px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.1;
    letter-spacing: -0.025em;
    margin-bottom: 10px;
  }

  .page-title .accent { color: var(--green-700); }

  .page-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    font-weight: 400;
  }

  /* Server buttons */
  .servers { display: flex; flex-direction: column; gap: 10px; }

  .server-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--white);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .server-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .server-btn.primary::before { background: var(--green-50); }
  .server-btn.secondary::before { background: var(--blue-50); }

  .server-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    border-color: transparent;
  }

  .server-btn:hover::before { opacity: 1; }
  .server-btn:active { transform: translateY(0); box-shadow: none; }

  .btn-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .btn-icon.green { background: var(--green-900); }
  .btn-icon.blue  { background: var(--blue-900); }

  .btn-icon i {
    font-size: 22px;
  }

  .btn-icon.green i { color: var(--green-100); }
  .btn-icon.blue i  { color: var(--blue-200); }

  .btn-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
    position: relative;
    z-index: 1;
  }

  .btn-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .btn-sub {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
  }

  .btn-arrow {
    font-size: 18px;
    color: var(--text-muted);
    transition: transform 0.15s ease, color 0.15s ease;
    position: relative;
    z-index: 1;
  }

  .server-btn:hover .btn-arrow {
    transform: translateX(4px);
    color: var(--text-secondary);
  }

  /* Footer status row */
  .status-row {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 400;
    white-space: nowrap;
  }

  .status-item i {
    font-size: 13px;
    color: var(--green-500);
  }

  /* Mobile */
  @media (max-width: 480px) {
    body { padding: 16px; }

    .card { padding: 28px 20px 24px; border-radius: 16px; }

    .page-title { font-size: 30px; }

    .company-name { font-size: 16px; }

    .logo-mark { width: 48px; height: 48px; border-radius: 12px; }

    .logo-mark i { font-size: 24px; }

    .status-row { justify-content: center; gap: 14px; }
  }

  @media (max-width: 360px) {
    .page-title { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="logo-row">
    <div class="logo-mark">
      <i class="ti ti-pill"></i>
    </div>
    <div class="company-info">
      <div class="company-name">Aushad Pharma Distributors<br>Pvt Ltd</div>
      <div class="company-tag">Inventory Management Portal</div>
    </div>
  </div>

  <hr class="rule">

  <div class="hero">
    <div class="live-badge">
      <span class="live-dot"></span>
      Live data
    </div>
    <div class="page-title">
      Live Stock<br>&amp; <span class="accent">Sales</span>
    </div>
    <div class="page-subtitle">
      Real-time inventory access across all distribution nodes.
    </div>
  </div>

  <div class="servers">

    <a class="server-btn primary" href="server1.html">
      <div class="btn-icon green">
        <i class="ti ti-server"></i>
      </div>
      <div class="btn-text">
        <div class="btn-title">Server 1</div>
        <div class="btn-sub">Primary distribution node</div>
      </div>
      <i class="ti ti-arrow-right btn-arrow"></i>
    </a>

    <a class="server-btn secondary" href="server2.html">
      <div class="btn-icon blue">
        <i class="ti ti-server-2"></i>
      </div>
      <div class="btn-text">
        <div class="btn-title">Server 2</div>
        <div class="btn-sub">Secondary distribution node</div>
      </div>
      <i class="ti ti-arrow-right btn-arrow"></i>
    </a>

  </div>

  <div class="status-row">
    <div class="status-item">
      <i class="ti ti-shield-check"></i>
      Secure access
    </div>
    <div class="status-item">
      <i class="ti ti-refresh"></i>
      Updated live
    </div>
    <div class="status-item">
      <i class="ti ti-lock"></i>
      Internal only
    </div>
  </div>

</div>

</body>
</html>
