<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aushad Pharma Distributors Pvt Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-900: #064e3b;
    --green-700: #047857;
    --green-500: #10b981;
    --green-100: #d1fae5;
    --green-50:  #ecfdf5;
    --blue-900:  #1e3a8a;
    --blue-700:  #1d4ed8;
    --blue-200:  #bfdbfe;
    --slate-800: #1e293b;
    --slate-500: #64748b;
    --slate-200: #e2e8f0;
    --white:     #ffffff;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0fdf4;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative background rings */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 500px; height: 500px;
    border: 1.5px solid rgba(16,185,129,0.12);
    top: -140px; left: -140px;
  }
  body::after {
    width: 400px; height: 400px;
    border: 1.5px solid rgba(29,78,216,0.10);
    bottom: -120px; right: -100px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--white);
    border-radius: 24px;
    padding: 40px 36px 32px;
    border: 1px solid rgba(16,185,129,0.18);
    box-shadow:
      0 0 0 6px rgba(16,185,129,0.05),
      0 20px 50px rgba(6,78,59,0.10);
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top accent bar */
  .accent-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .accent-bar span {
    height: 4px;
    border-radius: 2px;
    flex: 1;
    background: var(--green-500);
    opacity: 0.25;
  }
  .accent-bar span:first-child { opacity: 1; background: var(--green-700); }
  .accent-bar span:nth-child(2) { opacity: 0.6; }

  /* Header */
  .header { margin-bottom: 28px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .brand-icon {
    width: 36px; height: 36px;
    background: var(--green-900);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-icon svg {
    width: 20px; height: 20px;
    fill: var(--green-100);
  }

  .brand-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--green-900);
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--slate-800);
    line-height: 1.2;
    margin-bottom: 6px;
  }

  h1 em {
    font-style: normal;
    color: var(--green-700);
  }

  .tagline {
    font-size: 13px;
    font-weight: 300;
    color: var(--slate-500);
    letter-spacing: 0.04em;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--slate-200);
    margin: 24px 0;
  }

  /* Buttons */
  .btn-group { display: flex; flex-direction: column; gap: 12px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '→';
    position: absolute;
    right: 18px;
    font-size: 16px;
    transition: right 0.2s ease;
  }

  .btn:hover { transform: translateY(-2px); }
  .btn:hover::after { right: 14px; }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--green-900);
    color: var(--green-100);
    box-shadow: 0 4px 16px rgba(6,78,59,0.22);
  }
  .btn-primary:hover { box-shadow: 0 8px 24px rgba(6,78,59,0.28); }

  .btn-secondary {
    background: var(--blue-900);
    color: var(--blue-200);
    box-shadow: 0 4px 16px rgba(30,58,138,0.18);
  }
  .btn-secondary:hover { box-shadow: 0 8px 24px rgba(30,58,138,0.26); }

  .btn-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg {
    width: 16px; height: 16px;
    fill: currentColor;
  }

  .btn-label { display: flex; flex-direction: column; gap: 2px; }
  .btn-sub {
    font-size: 11px;
    font-weight: 300;
    opacity: 0.65;
    letter-spacing: 0.03em;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--slate-500);
    letter-spacing: 0.03em;
  }
  .footer svg {
    width: 12px; height: 12px;
    fill: var(--green-500);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">

  <div class="accent-bar">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <!-- Pill / capsule icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9A6 6 0 0 0 9 3zm0 2a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V9a4 4 0 0 1 4-4z"/>
          <rect x="5.5" y="11.5" width="7" height="1.5" rx="0.75"/>
          <path d="M18 6h-1a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h1a3 3 0 0 0 3-3V9a3 3 0 0 0-3-3z"/>
        </svg>
      </div>
      <div class="brand-name">Aushad Pharma Distributors Pvt Ltd</div>
    </div>

    <h1>Live Stock <em>&amp; Sales</em></h1>
    <div class="tagline">Real-time inventory access portal</div>
  </div>

  <hr class="divider">

  <div class="btn-group">
    <a class="btn btn-primary" href="server1.html">
      <div class="btn-icon">
        <!-- Server icon -->
        <svg viewBox="0 0 24 24"><path d="M2 5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5zm2 0v4h16V5H4zm14 2a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm-3 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM2 15a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4zm2 0v4h16v-4H4zm14 2a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm-3 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/></svg>
      </div>
      <div class="btn-label">
        Server 1
        <span class="btn-sub">Primary node</span>
      </div>
    </a>

    <a class="btn btn-secondary" href="server2.html">
      <div class="btn-icon">
        <svg viewBox="0 0 24 24"><path d="M2 5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5zm2 0v4h16V5H4zm14 2a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm-3 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM2 15a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4zm2 0v4h16v-4H4zm14 2a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm-3 0a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/></svg>
      </div>
      <div class="btn-label">
        Server 2
        <span class="btn-sub">Secondary node</span>
      </div>
    </a>
  </div>

  <div class="footer">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 2a8 8 0 0 1 0 16A8 8 0 0 1 12 4zm-1 4v5.41l3.29 3.3 1.42-1.42L13 12.59V8h-2z"/></svg>
    Secure internal access · Live data
  </div>

</div>
</body>
</html>
