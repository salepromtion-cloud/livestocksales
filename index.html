<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aushad Pharma Distributors Pvt Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L5L9W8DM4K"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-L5L9W8DM4K');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy-900:#071828;--navy-800:#0c2340;--navy-700:#112d52;
  --navy-200:#aac7f0;--navy-100:#d4e5f9;--navy-50:#edf4fd;
  --blue:#2563eb;--blue-l:#3b82f6;
  --text-primary:#07182e;--text-secondary:#3a5268;--text-muted:#7896ae;
  --border:#dde8f2;--bg:#eef3f9;--card:#ffffff;
  --shadow:0 2px 8px rgba(4,17,31,.07),0 16px 48px rgba(4,17,31,.10);
  --shadow-hover:0 4px 16px rgba(4,17,31,.10),0 28px 64px rgba(4,17,31,.15);
}
@media(prefers-color-scheme:dark){
  :root{
    --text-primary:#e6f0fb;--text-secondary:#7ea4bf;--text-muted:#3d5f78;
    --border:#102338;--bg:#060f1c;--card:#0b1a2e;
    --shadow:0 2px 8px rgba(0,0,0,.3),0 16px 48px rgba(0,0,0,.35);
    --shadow-hover:0 4px 16px rgba(0,0,0,.4),0 28px 64px rgba(0,0,0,.5);
  }
}
html{font-size:16px;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 20px;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(37,99,235,.13) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-25%;right:-20%;
  width:65vw;height:65vw;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.08) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}
.wrapper{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  animation:riseIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes riseIn{from{opacity:0;transform:translateY(22px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

/* header */
.header{
  background:linear-gradient(135deg,var(--navy-900) 0%,var(--navy-800) 100%);
  border-radius:22px 22px 0 0;padding:22px 28px;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
}
.header::before{content:'';position:absolute;top:-50px;right:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none;}
.logo-ring{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
.logo-ring i{font-size:19px;color:var(--navy-100);}
.header-info{flex:1;min-width:0;position:relative;z-index:1;}
.co-name{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.co-tag{font-size:10px;color:var(--navy-200);margin-top:3px;letter-spacing:.05em;text-transform:uppercase;}
.live-pill{position:relative;z-index:1;flex-shrink:0;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 11px;font-size:10px;font-weight:500;color:var(--navy-100);letter-spacing:.04em;}
.pulse{width:6px;height:6px;border-radius:50%;background:#60a5fa;animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* card */
.card{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 24px 24px;padding:38px 32px 32px;box-shadow:var(--shadow);}

/* hero */
.hero{margin-bottom:34px;padding-bottom:32px;border-bottom:1px solid var(--border);}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.ey-line{width:20px;height:2px;background:var(--blue-l);border-radius:2px;}
.ey-text{font-size:10.5px;font-weight:500;color:var(--blue);letter-spacing:.12em;text-transform:uppercase;}
.page-title{font-family:'Sora',sans-serif;font-size:clamp(34px,7.5vw,48px);font-weight:700;color:var(--text-primary);line-height:1.07;letter-spacing:-.03em;margin-bottom:12px;}
.page-title span{color:var(--blue);}
.page-sub{font-size:13.5px;font-weight:300;color:var(--text-secondary);line-height:1.65;}

/* server buttons */
.servers{display:flex;flex-direction:column;gap:12px;}

.srv{
  display:flex;align-items:center;gap:16px;
  text-decoration:none;padding:18px 20px;
  border-radius:16px;border:1px solid var(--border);
  background:var(--card);
  transition:all .22s cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;
}
.srv::before{content:'';position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,var(--navy-50) 0%,transparent 55%);opacity:0;transition:opacity .22s ease;}
@media(prefers-color-scheme:dark){.srv::before{background:linear-gradient(135deg,rgba(37,99,235,.08) 0%,transparent 55%);}}
.srv:hover{border-color:transparent;box-shadow:var(--shadow-hover);transform:translateY(-3px);}
.srv:hover::before{opacity:1;}
.srv:active{transform:translateY(0);box-shadow:var(--shadow);}

.srv-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
.s1-ic{background:var(--navy-800);box-shadow:0 4px 14px rgba(7,24,40,.32);}
.s2-ic{background:var(--navy-700);box-shadow:0 4px 14px rgba(17,45,82,.32);}
.srv-icon i{font-size:22px;}
.s1-ic i{color:var(--navy-100);}
.s2-ic i{color:var(--navy-200);}

.srv-body{flex:1;min-width:0;position:relative;z-index:1;}
.srv-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-.01em;margin-bottom:3px;}
.srv-desc{font-size:12px;color:var(--text-muted);}

.srv-arrow{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;transition:all .22s ease;}
.srv-arrow i{font-size:15px;color:var(--text-muted);transition:all .22s ease;}
.srv:hover .srv-arrow{background:var(--navy-800);border-color:var(--navy-800);}
.srv:hover .srv-arrow i{color:var(--navy-100);transform:translateX(2px);}

/* footer */
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.foot-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);}
.foot-item i{font-size:13px;color:var(--blue-l);}

@media(max-width:520px){
  body{padding:20px 14px;align-items:flex-start;padding-top:40px;}
  .header{padding:16px 20px;border-radius:18px 18px 0 0;}
  .co-name{font-size:13px;}
  .live-pill{display:none;}
  .card{padding:28px 20px 24px;}
  .foot{justify-content:center;gap:16px;}
}
@media(min-width:860px){.wrapper{max-width:520px;}}
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="logo-ring"><i class="ti ti-pill"></i></div>
    <div class="header-info">
      <div class="co-name">Aushad Pharma Distributors Pvt Ltd</div>
      <div class="co-tag">Inventory Management Portal</div>
    </div>
    <div class="live-pill"><span class="pulse"></span>Live</div>
  </div>

  <div class="card">

    <div class="hero">
      <div class="eyebrow"><div class="ey-line"></div><div class="ey-text">Distribution Network</div></div>
      <div class="page-title">Live Stock<br>&amp; <span>Sales</span></div>
      <div class="page-sub">Real-time inventory access across all distribution nodes.</div>
    </div>

    <div class="servers">
      <a class="srv" href="server1.html">
        <div class="srv-icon s1-ic"><i class="ti ti-server"></i></div>
        <div class="srv-body">
          <div class="srv-title">Server 1</div>
          <div class="srv-desc">Primary distribution node</div>
        </div>
        <div class="srv-arrow"><i class="ti ti-arrow-right"></i></div>
      </a>

      <a class="srv" href="server2.html">
        <div class="srv-icon s2-ic"><i class="ti ti-server-2"></i></div>
        <div class="srv-body">
          <div class="srv-title">Server 2</div>
          <div class="srv-desc">Secondary distribution node</div>
        </div>
        <div class="srv-arrow"><i class="ti ti-arrow-right"></i></div>
      </a>
    </div>

    <div class="foot">
      <div class="foot-item"><i class="ti ti-shield-check"></i>Secure access</div>
      <div class="foot-item"><i class="ti ti-refresh"></i>Updated live</div>
      <div class="foot-item"><i class="ti ti-lock"></i>Internal only</div>
    </div>

  </div>
</div>
</body>
</html>
